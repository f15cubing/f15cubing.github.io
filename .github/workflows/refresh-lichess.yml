name: Refresh Lichess game

# Picks the bot's latest good win, commits it if it changed, and then calls the
# deploy workflow directly.
#
# It has to call deploy rather than rely on the push: GitHub does not fire
# `on: push` for commits made with the default GITHUB_TOKEN, so this job's own
# commits never triggered a build and the refreshed game sat undeployed until a
# human happened to push something.
#
# Runs daily at 06:12 UTC, off the hour to avoid the minute when every scheduled
# job on GitHub fires at once.
on:
  schedule:
    - cron: '12 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-lichess
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Lets the deploy job below run only when there is actually new data.
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the rebase-and-retry below has something to rebase
          # onto. The repository is small, so this costs nothing.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No dependencies: the script uses built-in fetch.
      - name: Fetch latest win
        run: node scripts/fetch-lichess.mjs

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- src/data/lichess-game.json; then
            echo "No change; nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/lichess-game.json
          git commit -m "chore(lichess): refresh featured game"

          # You may have pushed between this job's checkout and now, which would
          # get our push rejected and turn the run red through no fault of the
          # data. Replay this commit on top of whatever landed and try again.
          # Only this one file is ever touched here and you will never hand-edit
          # it, so the rebase has nothing to conflict with in practice.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected; rebasing onto origin/main and retrying."
            git pull --rebase origin main || {
              echo "Rebase failed. Someone hand-edited the cached game file."
              exit 1
            }
          done

          echo "Still could not push after 3 attempts."
          exit 1

  # Publish the commit the job above just made. Skipped when the featured game
  # didn't change, so an unchanged day costs nothing.
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
