name: Deploy to GitHub Pages

# Manual-only for now, because the repository is private and Pages is not
# enabled. Running it before then fails at `configure-pages`, which is noise.
#
# TO GO LIVE:
#   1. Make the repository public (Pages on a private repo needs GitHub Pro).
#   2. Settings → Pages → Source: GitHub Actions.
#   3. Uncomment the `push` trigger below so every commit to main deploys.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; cancel a superseded one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
