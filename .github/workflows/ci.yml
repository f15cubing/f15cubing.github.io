name: CI

# Type-checks and builds on every push. This is the one that should always be
# green; deployment lives in deploy.yml and is armed separately.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Validates content frontmatter against the collection schema, so a typo
      # in a post or project can't reach the site.
      - run: pnpm check

      - run: pnpm build
